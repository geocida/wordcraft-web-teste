<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sonda S Pen (Chrome)</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header, footer { padding: 8px 12px; font-size: 14px; }
  canvas { width: 100%; height: 100%; touch-action: none; background: #fafafa; display: block; }
  #log { font: 12px ui-monospace, monospace; height: 9em; overflow: auto; white-space: pre; }
  textarea { width: 100%; height: 4em; font-size: 16px; box-sizing: border-box; }
</style>
</head>
<body>
<header id="resumo">Desenhe com a S Pen. Os números aparecem aqui.</header>
<canvas id="tela"></canvas>
<footer>
  <textarea id="texto" placeholder="Teste de teclado: acentos, autocorreção, ditado"></textarea>
  <div id="log"></div>
</footer>
<script>
// Sonda do que o Chrome entrega ao JavaScript, para comparar com o egui web
// (eframe/src/web/events.rs, que não lê pressure, pointerType nem tilt do PointerEvent).
"use strict";
const tela = document.getElementById("tela");
const ctx = tela.getContext("2d");
const resumo = document.getElementById("resumo");
const log = document.getElementById("log");
const est = { eventos: 0, hover: 0, pressoes: new Set(), tipos: new Set(), tiltMax: 0, botoes: new Set(), agrupados: 0, quadros: [] };
let anterior = null;

function ajustar() {
  const r = tela.getBoundingClientRect();
  tela.width = r.width * devicePixelRatio;
  tela.height = r.height * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
addEventListener("resize", ajustar);
ajustar();

function registrar(linha) {
  console.log(linha);
  log.textContent = linha + "\n" + log.textContent.slice(0, 6000);
}

function ponto(e) {
  est.eventos++;
  est.tipos.add(e.pointerType);
  est.pressoes.add(Math.round(e.pressure * 1000));
  est.tiltMax = Math.max(est.tiltMax, Math.abs(e.tiltX), Math.abs(e.tiltY));
  est.botoes.add(e.buttons);
  if (e.type === "pointermove" && e.buttons === 0) est.hover++;
}

tela.addEventListener("pointerdown", e => { ponto(e); anterior = { x: e.offsetX, y: e.offsetY }; registrar(`down tipo=${e.pointerType} pressao=${e.pressure.toFixed(3)} tilt=${e.tiltX},${e.tiltY} botoes=${e.buttons} botao=${e.button}`); });
tela.addEventListener("pointermove", e => {
  const lista = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  est.agrupados += lista.length;
  for (const c of lista) {
    ponto(c);
    if (c.buttons !== 0 && anterior) {
      ctx.strokeStyle = c.pointerType === "pen" ? "#143ca0" : "#b42828";
      ctx.lineWidth = 1 + 14 * c.pressure;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(anterior.x, anterior.y); ctx.lineTo(c.offsetX, c.offsetY); ctx.stroke();
      anterior = { x: c.offsetX, y: c.offsetY };
    }
  }
  if (e.buttons === 0) registrar(`hover tipo=${e.pointerType} x=${e.offsetX.toFixed(0)} y=${e.offsetY.toFixed(0)}`);
});
tela.addEventListener("pointerup", e => { ponto(e); anterior = null; registrar(`up tipo=${e.pointerType} botao=${e.button}`); });
tela.addEventListener("contextmenu", e => { e.preventDefault(); registrar("contextmenu (botão lateral?)"); });

const texto = document.getElementById("texto");
for (const t of ["compositionstart", "compositionupdate", "compositionend", "beforeinput", "keydown"]) {
  texto.addEventListener(t, e => registrar(`${t} data=${JSON.stringify(e.data ?? e.key)} inputType=${e.inputType ?? ""} isComposing=${e.isComposing ?? ""}`));
}

function quadro(t) {
  est.quadros.push(t);
  while (est.quadros.length > 120) est.quadros.shift();
  const n = est.quadros.length;
  const qps = n > 1 ? (1000 * (n - 1)) / (est.quadros[n - 1] - est.quadros[0]) : 0;
  resumo.textContent = `qps ${qps.toFixed(0)} | eventos ${est.eventos} (agrupados ${est.agrupados}) | tipos ${[...est.tipos].join(",")} | pressões distintas ${est.pressoes.size} | tilt máx ${est.tiltMax} | hover ${est.hover} | botões vistos ${[...est.botoes].join(",")}`;
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
